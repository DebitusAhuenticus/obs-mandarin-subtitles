<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      border-radius: 10px;
    }
    #mic-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <button id="mic-btn" onclick="initMic()">Включить микрофон</button>
  <div id="text">Нажмите кнопку выше через «Взаимодействовать»</div>

  <script>
    const textDiv = document.getElementById('text');
    const btn = document.getElementById('mic-btn');

    async function initMic() {
      try {
        textDiv.innerText = 'Запрос доступа...';
        await navigator.mediaDevices.getUserMedia({ audio: true });
        btn.style.display = 'none';
        startSpeech();
      } catch (e) {
        textDiv.innerText = 'Ошибка микрофона: ' + e.message;
      }
    }

    function startSpeech() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        textDiv.innerText = 'Браузер OBS не поддерживает Web Speech API';
        return;
      }

      const recog = new Speech();
      recog.continuous = true;
      recog.interimResults = true;
      recog.lang = 'zh-CN'; // Язык распознавания (Китайский)

      recog.onstart = () => { textDiv.innerText = 'Слушаю речь...'; };
      recog.onerror = (e) => { textDiv.innerText = 'Ошибка распознавания: ' + e.error; };
      recog.onend = () => { recog.start(); };

      recog.onresult = (e) => {
        let str = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          str += e.results[i][0].transcript;
        }
        textDiv.innerText = str;
      };

      try { recog.start(); } catch(e) {}
    }
  </script>
</body>
</html>
